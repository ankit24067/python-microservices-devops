services:
  backend:
    image: ankit395/backend-service
    ports:
      - "5000:5000"

  frontend:
    image: ankit395/frontend-service
    ports:
      - "3000:3000"

  logger:
    image: ankit395/logger-service
    ports:
      - "4000:4000"

  db:
    image: postgres:13
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
